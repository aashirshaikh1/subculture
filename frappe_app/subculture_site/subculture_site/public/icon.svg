<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Subculture">
  <!-- Subculture icon: the serif S on the site's fuchsia-to-rose gradient, as in the project cards -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <text x="32" y="34" fill="#ffffff" font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="38" font-weight="600" text-anchor="middle" dominant-baseline="central">S</text>
</svg>
